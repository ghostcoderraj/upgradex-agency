<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE885" />
      <stop offset="35%" stop-color="#D4AF37" />
      <stop offset="70%" stop-color="#AA7C11" />
      <stop offset="100%" stop-color="#F3E5AB" />
    </linearGradient>
    <linearGradient id="gold-stroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2A8" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#8A6409" />
    </linearGradient>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121016" />
      <stop offset="100%" stop-color="#030305" />
    </linearGradient>
    <filter id="gold-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Icon Container -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bg-grad)" stroke="url(#gold-stroke)" stroke-width="1.5" />

  <!-- Modern Stylized UpgradeX "X" Graphic -->
  <g filter="url(#gold-glow)">
    <!-- Diagonal stroke 1: Top-Left to Bottom-Right -->
    <path d="M16 16 L24 16 L48 48 L40 48 Z" fill="url(#gold-grad)" />
    
    <!-- Diagonal stroke 2: Top-Right to Center-Right & Center-Left to Bottom-Left (Dynamic sliced look) -->
    <path d="M48 16 L40 16 L34 24 L40 30 Z" fill="url(#gold-grad)" />
    <path d="M24 34 L16 48 L24 48 L30 40 Z" fill="url(#gold-grad)" />
    
    <!-- Accent Chevron / Growth Node in Center -->
    <polygon points="32,26 36,32 32,38 28,32" fill="#FFF2A8" opacity="0.9" />
  </g>
</svg>